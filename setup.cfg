[metadata]
name = wavin_sentio_connect
version = attr: wavin_sentio_connect.__version__
author = HairingX
license = MIT
description = Wavin Sentio over Modbus TCP, built on modbus_event_connect.
keywords = wavin, sentio, modbus, modbus_tcp
url = https://github.com/HairingX/wavin_sentio_connect
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
    Development Status :: 3 - Alpha
    Programming Language :: Python :: 3.12
    Intended Audience :: Developers
    Topic :: Software Development :: Libraries
    License :: OSI Approved :: MIT License

[options]
python_requires = >=3.12
packages = find:
package_dir =
    =src
zip_safe = False
install_requires =
    modbus_event_connect >=0.2.0rc1,<0.3

[options.packages.find]
where=src

[options.package_data]
# PEP 561: tells a type checker the package ships its own types, so a consumer does not have
# to silence the import.
wavin_sentio_connect = py.typed
