[metadata]
name = wavin_sentio_connect
version = attr: wavin_sentio_connect.__version__
author = HairingX
license = MIT
description = Event-driven, async client for the Wavin Sentio floor heating controller: every room and peripheral, typed, and told when a value changes - over Modbus TCP.
keywords = wavin, sentio, floor heating, modbus, modbus-tcp, asyncio
url = https://github.com/HairingX/wavin_sentio_connect
project_urls =
    Source = https://github.com/HairingX/wavin_sentio_connect
    Issues = https://github.com/HairingX/wavin_sentio_connect/issues
    Releases = https://github.com/HairingX/wavin_sentio_connect/releases
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
    Development Status :: 3 - Alpha
    Framework :: AsyncIO
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Topic :: Software Development :: Libraries
    Topic :: Home Automation
    Typing :: Typed

[options]
python_requires = >=3.12
packages = find:
package_dir =
    =src
zip_safe = False
install_requires =
    modbus_event_connect >=0.2.0rc2,<0.3

[options.packages.find]
where=src

[options.package_data]
# PEP 561: tells a type checker the package ships its own types, so a consumer does not have
# to silence the import.
wavin_sentio_connect = py.typed
