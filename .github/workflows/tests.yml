name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LIBRARY: https://github.com/HairingX/modbus_event_connect

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # main and pull requests test against the published library this package declares, so
      # nothing merges that depends on an unreleased one. A development branch whose name the
      # library also has is tested against that branch, as the two are developed together.
      - name: Install dependencies
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$GITHUB_REF_NAME" != "main" ] \
              && git ls-remote --exit-code --heads "$LIBRARY" "$GITHUB_REF_NAME" > /dev/null; then
            echo "Library: branch $GITHUB_REF_NAME, in development"
            git clone --depth 1 --branch "$GITHUB_REF_NAME" "$LIBRARY" "$RUNNER_TEMP/modbus_event_connect"
            python -m pip install "$RUNNER_TEMP/modbus_event_connect" pytest pytest-asyncio pyright==1.1.414
          else
            echo "Library: the published version this package declares"
            python -m pip install . pytest pytest-asyncio pyright==1.1.414
          fi
          python -m pip show modbus_event_connect | head -2

      - name: Type check (pyright strict)
        run: pyright

      # Live tests need a real controller; they skip themselves without one, and are excluded here.
      - name: Test
        run: python -m pytest -m "not live" -q -o log_cli=false
